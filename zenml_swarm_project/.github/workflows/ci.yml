name: build-and-publish

# Runs on every push to main and on pull requests. Pushes to main also
# build and publish a Docker image to GitHub Container Registry (ghcr.io),
# tagged with both the short git SHA and 'latest' — so the image tag and
# the git commit that produced it are always traceable back to each other,
# the same way steps/train.py ties an MLflow model version back to a git
# commit and a DVC data hash.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize ZenML + register a local stack
        run: |
          zenml init
          zenml integration install mlflow -y
          zenml artifact-store register ci_store --flavor=local
          zenml orchestrator register ci_orchestrator --flavor=local
          zenml experiment-tracker register ci_tracker --flavor=mlflow
          zenml stack register ci_stack -a ci_store -o ci_orchestrator -e ci_tracker
          zenml stack set ci_stack

      - name: Run the training pipeline as a smoke test
        run: |
          sed -i 's#file:/app/mlruns#file:'"$PWD"'/mlruns#g' steps/train.py steps/register_model.py
          python run_pipeline.py

      - name: Version the dataset with DVC
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"
          dvc add data/breast_cancer.csv
          echo "Dataset hash: $(grep md5 data/breast_cancer.csv.dvc)"

  build-and-push-image:
    needs: test-pipeline
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
